name: Deploy PrepTrack

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm run test

      # Auto-advance the patch version on every merge to main, so the deployed
      # app always reports a fresh version and the "What's new" dialog fires.
      # The bump happens BEFORE the new tag is created, so the release-notes
      # script still sees the previous tag and lists the actual new changes.
      - name: Auto-bump patch version
        run: npm version patch --no-git-tag-version

      - name: Build
        run: npm run build
        env:
          GITHUB_PAGES: 'true'

      - name: Commit & tag new version
        run: |
          NEW_VERSION="v$(node -p "require('./package.json').version")"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json src/generated/release-notes.json
          git commit -m "chore(release): ${NEW_VERSION} [skip ci]"
          git tag -a "${NEW_VERSION}" -m "${NEW_VERSION}"
          # Pushes made with GITHUB_TOKEN do not re-trigger workflows -> no loop.
          git push origin HEAD:main --follow-tags

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
